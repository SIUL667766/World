<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 690" width="1800" height="690" font-family="'Helvetica Neue', Arial, sans-serif">
  <style>
    .ln{fill:none;stroke:#111;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
    .hd{fill:#fff;stroke:#111;stroke-width:4}
    .ink{fill:#111}
    .nm{font-size:26px;font-weight:800;fill:#111;text-anchor:middle;letter-spacing:1px}
    .ds{font-size:17px;fill:#333;text-anchor:middle}
  </style>
  <rect width="1800" height="690" fill="#fff"/>
  <text x="900" y="70" text-anchor="middle" font-size="44" font-weight="900" fill="#111" letter-spacing="2">MIAMI SIN FILTRO</text>
  <rect x="690" y="88" width="420" height="38" rx="19" fill="#F7B6C2"/>
  <text x="900" y="114" text-anchor="middle" font-size="20" font-weight="700" fill="#111">PERSONAJES · HOJA DE MODELO</text>

  <!-- ===== JAY FONTANA ===== -->
  <g transform="translate(150,260)">
    <ellipse cx="0" cy="282" rx="70" ry="10" fill="#A8E0D1"/>
    <path class="ln" d="M0 55 V175 M0 175 L-30 272 M0 175 L30 272"/>
    <!-- lanyard + badge -->
    <path class="ln" d="M-12 58 L0 110 L12 58" stroke-width="3"/>
    <rect x="-13" y="108" width="26" height="32" rx="3" fill="#A7D3F2" stroke="#111" stroke-width="3"/>
    <circle cx="0" cy="121" r="5" fill="#fff" stroke="#111" stroke-width="2"/>
    <!-- left arm: notebook -->
    <path class="ln" d="M0 88 L-40 130 L-55 165"/>
    <rect x="-82" y="150" width="34" height="44" rx="4" fill="#FBE3A1" stroke="#111" stroke-width="3" transform="rotate(-12 -65 172)"/>
    <!-- right arm: mic -->
    <path class="ln" d="M0 88 L45 118 L62 72"/>
    <rect x="57" y="40" width="12" height="40" rx="4" class="ink" transform="rotate(18 63 60)"/>
    <circle cx="72" cy="35" r="14" class="ink"/>
    <rect x="60" y="48" width="24" height="12" rx="2" fill="#F7B6C2" stroke="#111" stroke-width="2" transform="rotate(18 72 54)"/>
    <!-- head -->
    <circle class="hd" cx="0" cy="0" r="55"/>
    <path class="ln" d="M-28 -6 H-8 M8 -6 H28"/>
    <circle class="ink" cx="-17" cy="0" r="3.5"/><circle class="ink" cx="17" cy="0" r="3.5"/>
    <path class="ln" d="M8 -20 L27 -26" stroke-width="3.5"/>
    <path class="ln" d="M-28 -18 H-10" stroke-width="3.5"/>
    <path class="ln" d="M-8 28 H12"/>
    <text class="nm" y="335">JAY FONTANA</text>
    <text class="ds" y="362">Periodista independiente</text>
    <text class="ds" y="384">"Si es raro, es noticia."</text>
  </g>

  <!-- ===== DJ CHISME ===== -->
  <g transform="translate(450,260)">
    <ellipse cx="0" cy="282" rx="70" ry="10" fill="#CDBEF0"/>
    <path class="ln" d="M0 55 V175 M0 175 L-30 272 M0 175 L30 272"/>
    <!-- arms: shrug -->
    <path class="ln" d="M0 88 L-45 120 L-62 92 M0 88 L45 120 L62 92"/>
    <path class="ln" d="M-70 88 L-62 92 L-58 82 M70 88 L62 92 L58 82" stroke-width="3"/>
    <circle class="hd" cx="0" cy="0" r="55"/>
    <!-- fedora -->
    <ellipse cx="0" cy="-40" rx="64" ry="9" class="ink"/>
    <path class="ink" d="M-34 -42 L-28 -82 Q0 -92 28 -82 L34 -42 Z"/>
    <rect x="-33" y="-54" width="66" height="8" fill="#F7B6C2"/>
    <!-- sunglasses -->
    <rect x="-36" y="-12" width="30" height="20" rx="7" class="ink"/>
    <rect x="6" y="-12" width="30" height="20" rx="7" class="ink"/>
    <path class="ln" d="M-6 -6 H6" stroke-width="3"/>
    <path class="ln" d="M-8 28 Q4 34 14 26"/>
    <text class="nm" y="335">DJ CHISME</text>
    <text class="ds" y="362">Amigo y fuente número uno</text>
    <text class="ds" y="384">Sabe todo, siempre.</text>
  </g>

  <!-- ===== LA INTERNA ===== -->
  <g transform="translate(750,260)">
    <ellipse cx="0" cy="282" rx="70" ry="10" fill="#F7B6C2"/>
    <!-- hair behind -->
    <path d="M-60 5 Q-66 -62 0 -64 Q66 -62 60 5 L62 78 Q40 90 30 60 L-30 60 Q-40 90 -62 78 Z" fill="#3A2A22"/>
    <path class="ln" d="M0 55 V175 M0 175 L-30 272 M0 175 L30 272"/>
    <!-- skirt-ish triangle body accent -->
    <path d="M0 135 L-28 180 H28 Z" fill="#A8E0D1" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <!-- arms: phone up + mic -->
    <path class="ln" d="M0 88 L-42 110 L-58 70"/>
    <rect x="-74" y="34" width="28" height="46" rx="5" fill="#A7D3F2" stroke="#111" stroke-width="3"/>
    <path class="ln" d="M0 88 L42 125 L60 110"/>
    <rect x="58" y="92" width="10" height="28" rx="3" class="ink" transform="rotate(-30 63 106)"/>
    <circle cx="72" cy="88" r="11" class="ink"/>
    <circle class="hd" cx="0" cy="0" r="55"/>
    <path d="M-50 -22 Q-30 -60 20 -52 Q45 -46 52 -22 Q20 -40 -50 -22 Z" fill="#3A2A22"/>
    <circle class="ink" cx="-17" cy="2" r="4"/><circle class="ink" cx="17" cy="2" r="4"/>
    <path class="ln" d="M-10 26 Q2 36 14 24"/>
    <text class="nm" y="335">LA INTERNA</text>
    <text class="ds" y="362">Joven, rápida e irónica</text>
    <text class="ds" y="384">Domina TikTok y el caos.</text>
  </g>

  <!-- ===== DON PEPE ===== -->
  <g transform="translate(1050,260)">
    <ellipse cx="0" cy="282" rx="70" ry="10" fill="#FBE3A1"/>
    <path class="ln" d="M0 55 V175 M0 175 L-30 272 M0 175 L30 272"/>
    <!-- arms: one up pointing (philosophical), one on hip -->
    <path class="ln" d="M0 88 L-40 120 L-14 150"/>
    <path class="ln" d="M0 88 L44 100 L66 60 M66 60 L70 44"/>
    <circle class="hd" cx="0" cy="0" r="55"/>
    <!-- flat cap -->
    <path d="M-52 -22 Q-50 -64 0 -64 Q48 -64 54 -26 Z" fill="#F9A98B" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <path d="M30 -28 Q70 -30 78 -20 Q60 -14 34 -18 Z" fill="#F9A98B" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <!-- glasses -->
    <circle cx="-17" cy="0" r="12" fill="none" stroke="#111" stroke-width="3"/>
    <circle cx="17" cy="0" r="12" fill="none" stroke="#111" stroke-width="3"/>
    <path class="ln" d="M-5 0 H5" stroke-width="3"/>
    <circle class="ink" cx="-17" cy="1" r="3"/><circle class="ink" cx="17" cy="1" r="3"/>
    <!-- mustache -->
    <path class="ink" d="M-30 26 Q-16 12 0 20 Q16 12 30 26 Q14 24 0 28 Q-14 24 -30 26 Z"/>
    <!-- question marks -->
    <text x="64" y="-46" font-size="30" font-weight="800" fill="#111">?</text>
    <text x="82" y="-66" font-size="22" font-weight="800" fill="#111">?</text>
    <text class="nm" y="335">DON PEPE</text>
    <text class="ds" y="362">Taxista filósofo</text>
    <text class="ds" y="384">Tiene la mejor información.</text>
  </g>

  <!-- ===== LA INFLUENCER ===== -->
  <g transform="translate(1350,260)">
    <ellipse cx="0" cy="282" rx="70" ry="10" fill="#A7D3F2"/>
    <path d="M-60 5 Q-66 -62 0 -64 Q66 -62 60 5 L58 100 Q40 110 30 80 L-30 80 Q-40 110 -58 100 Z" fill="#F2D27A" stroke="#111" stroke-width="3"/>
    <path class="ln" d="M0 55 V175 M0 175 L-30 272 M0 175 L30 272"/>
    <path d="M0 135 L-28 180 H28 Z" fill="#F7B6C2" stroke="#111" stroke-width="3" stroke-linejoin="round"/>
    <!-- selfie stick -->
    <path class="ln" d="M0 88 L40 96 L60 60 L92 -40"/>
    <rect x="80" y="-90" width="30" height="50" rx="5" fill="#fff" stroke="#111" stroke-width="3" transform="rotate(18 95 -65)"/>
    <path class="ln" d="M0 88 L-40 112 L-56 86"/>
    <!-- peace sign -->
    <path class="ln" d="M-56 86 L-64 66 M-56 86 L-50 66" stroke-width="3"/>
    <circle class="hd" cx="0" cy="0" r="55"/>
    <path d="M-52 -18 Q-38 -60 10 -56 Q48 -50 54 -14 Q10 -36 -52 -18 Z" fill="#F2D27A" stroke="#111" stroke-width="3"/>
    <path class="ln" d="M-26 -2 Q-17 -8 -8 -2 M8 -2 Q17 -8 26 -2" stroke-width="3.5"/>
    <circle class="ink" cx="-17" cy="3" r="3.5"/><circle class="ink" cx="17" cy="3" r="3.5"/>
    <path d="M-12 22 Q0 38 12 22 Z" fill="#111"/>
    <!-- hearts -->
    <path d="M-92 -40 c-6 -10 -20 -4 -14 8 l14 12 l14 -12 c6 -12 -8 -18 -14 -8z" fill="#F7B6C2" stroke="#111" stroke-width="2.5"/>
    <path d="M-70 -84 c-4 -7 -14 -3 -10 6 l10 8 l10 -8 c4 -9 -6 -13 -10 -6z" fill="#F7B6C2" stroke="#111" stroke-width="2.5"/>
    <text class="nm" y="335">LA INFLUENCER</text>
    <text class="ds" y="362">Quiere salir en la noticia</text>
    <text class="ds" y="384">pero siempre sale mal.</text>
  </g>

  <!-- ===== EL EDITOR ===== -->
  <g transform="translate(1650,260)">
    <ellipse cx="0" cy="282" rx="70" ry="10" fill="#F9A98B"/>
    <path class="ln" d="M0 55 V175 M0 175 L-30 272 M0 175 L30 272"/>
    <!-- crossed arms -->
    <path class="ln" d="M0 88 L-36 118 L28 128"/>
    <path class="ln" d="M0 88 L36 112 L-26 132"/>
    <!-- coffee mug in hand -->
    <rect x="-46" y="116" width="24" height="28" rx="3" fill="#fff" stroke="#111" stroke-width="3"/>
    <path class="ln" d="M-46 124 Q-58 130 -46 138" stroke-width="3"/>
    <path class="ln" d="M-38 108 Q-34 100 -38 94 M-30 108 Q-26 100 -30 94" stroke-width="2.5"/>
    <circle class="hd" cx="0" cy="0" r="55"/>
    <!-- heavy lids, tired -->
    <path class="ln" d="M-30 -2 H-6 M6 -2 H30"/>
    <circle class="ink" cx="-17" cy="4" r="3.5"/><circle class="ink" cx="17" cy="4" r="3.5"/>
    <path class="ln" d="M-30 -16 L-8 -10 M8 -10 L30 -16" stroke-width="3.5"/>
    <path class="ln" d="M-12 30 Q0 22 12 30"/>
    <!-- deadline sign -->
    <rect x="18" y="-96" width="118" height="36" rx="4" fill="#FBE3A1" stroke="#111" stroke-width="3"/>
    <text x="77" y="-72" text-anchor="middle" font-size="15" font-weight="800" fill="#111">¿Y LA NOTA?</text>
    <text class="nm" y="335">EL EDITOR</text>
    <text class="ds" y="362">Cínico, brillante</text>
    <text class="ds" y="384">y sin paciencia para nadie.</text>
  </g>
</svg>
